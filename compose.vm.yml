services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - languagetool
      - sinonims
      - diccionari
    environment:
      CORRECTOR_HOST: ${CORRECTOR_HOST}
      SINONIMS_HOST: ${SINONIMS_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy

  diccionari:
    image: python:3.11.14-slim-bookworm
    restart: unless-stopped
    working_dir: /work/diccionari/src/web
    environment:
      DICTIONARY_INDEX_DIR: /data/indexdir
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    expose:
      - "8001"
    volumes:
      - ./backend/diccionari-multilingue:/work/diccionari:ro
      - ./local-backend/diccionari:/data:ro
      - diccionari-python:/opt/diccionari-python
    command: >
      sh -ec '
      if [ ! -x /opt/diccionari-python/bin/gunicorn ]; then
        python -m venv /opt/diccionari-python;
        /opt/diccionari-python/bin/pip install --no-cache-dir Flask==3.1.2 Whoosh==2.7.4 mwparserfromhell==0.7.2 gunicorn==23.0.0;
      fi;
      test -f /data/indexdir/_MAIN_0.toc || test -n "$$(find /data/indexdir -name "*.toc" -print -quit)";
      exec /opt/diccionari-python/bin/gunicorn --bind 0.0.0.0:8001 --workers 2 --threads 2 --timeout 30 --access-logfile - web_search:app'

  languagetool:
    image: maven:3.9.6-eclipse-temurin-17
    restart: unless-stopped
    working_dir: /work/languagetool
    environment:
      TZ: ${TZ:-Europe/Madrid}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${TZ:-Europe/Madrid} -Xms${LT_XMS_MB:-512}m -Xmx${LT_HEAP_MB:-1536}m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication
      FORCE_REBUILD: ${FORCE_REBUILD:-false}
      LT_MAX_CHECK_THREADS: ${LT_MAX_CHECK_THREADS:-16}
    expose:
      - "8081"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./backend/languagetool:/work/languagetool
      - languagetool-m2:/root/.m2
    command: >
      sh -lc '
      jar_path=$$(find languagetool-server/target -maxdepth 1 -type f -name "*.jar" ! -name "*sources*" ! -name "*javadoc*" 2>/dev/null | head -n 1);
      if [ "$${FORCE_REBUILD}" = "true" ] || [ -z "$${jar_path}" ]; then
        mvn -P=-jdk17 -T 1C -pl languagetool-server -am -Dmaven.test.skip=true clean package;
        mvn -P=-jdk17 -pl languagetool-server -am -Dmaven.test.skip=true dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/libs -Dmdep.stripVersion=true;
        core_jar=$$(find languagetool-core/target -maxdepth 1 -type f -name "languagetool-core-*.jar" ! -name "*sources*" ! -name "*javadoc*" 2>/dev/null | head -n 1);
        ca_jar=$$(find languagetool-language-modules/ca/target -maxdepth 1 -type f -name "*.jar" ! -name "*sources*" ! -name "*javadoc*" 2>/dev/null | head -n 1);
        test -n "$${core_jar}";
        test -n "$${ca_jar}";
        cp -f "$${core_jar}" languagetool-server/target/libs/languagetool-core.jar;
        cp -f "$${ca_jar}" languagetool-server/target/libs/language-ca.jar;
      fi;
      jar_path=$$(find languagetool-server/target -maxdepth 1 -type f -name "*.jar" ! -name "*sources*" ! -name "*javadoc*" 2>/dev/null | head -n 1);
      test -n "$${jar_path}";
      java -jar "$${jar_path}" --port 8081 --public --allow-origin "*" --maxCheckThreads "$${LT_MAX_CHECK_THREADS}"'

  sinonims:
    image: maven:3.9.6-eclipse-temurin-17
    restart: unless-stopped
    working_dir: /work/sinonims-cat
    environment:
      TZ: ${TZ:-Europe/Madrid}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${TZ:-Europe/Madrid} -Xms${SINONIMS_XMS_MB:-256}m -Xmx${SINONIMS_HEAP_MB:-512}m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication
      FORCE_REBUILD: ${FORCE_REBUILD:-false}
    expose:
      - "8000"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./backend/sinonims-cat:/work/sinonims-cat
      - ./local-backend/configs:/work/config
      - ./local-backend/data:/work/data
      - sinonims-m2:/root/.m2
    command: >
      sh -lc '
      app_jar=server/target/sinonims-0.0.1-SNAPSHOT-jar-with-dependencies.jar;
      if [ "$${FORCE_REBUILD}" = "true" ] || [ ! -s "$${app_jar}" ]; then
        rm -rf server/target;
        mvn -f server/pom.xml -DskipTests clean package;
      fi;
      test -s "$${app_jar}";
      if [ ! -f /work/data/.prebuilt ] || [ "$${FORCE_REBUILD}" = "true" ]; then
        java -jar "$${app_jar}" --config /work/config/sinonims-prebuild.cfg;
        touch /work/data/.prebuilt;
      fi;
      java -jar "$${app_jar}" --config /work/config/sinonims.cfg'

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
  languagetool-m2:
  sinonims-m2:
  diccionari-python:

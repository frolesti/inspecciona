<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <title>Opcions - Inspecciona</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  </head>
  <body class="bg-light">
    <div class="container py-4" style="max-width:700px">

      <h4 class="fw-bold text-success mb-4">Opcions d'Inspecciona</h4>

      <div class="card mb-3">
        <div class="card-body">
          <h6 class="card-title">Variant preferida</h6>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="variant" id="varGeneral" value="general" />
            <label class="form-check-label" for="varGeneral">centrals</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="variant" id="varValencia" value="valencia" />
            <label class="form-check-label" for="varValencia">valencianes</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="variant" id="varBalear" value="balear" />
            <label class="form-check-label" for="varBalear">balears</label>
          </div>
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-body">
          <h6 class="card-title">Comportament</h6>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="autoOpenHelper" />
            <label class="form-check-label" for="autoOpenHelper">
              Mostrar el botó automàticament en camps editables
            </label>
          </div>
        </div>
      </div>

      <div class="d-flex align-items-center gap-2">
        <button id="save" type="button" class="btn btn-success btn-sm">Desa</button>
        <span id="status" class="text-muted small"></span>
      </div>

    </div>
    <script src="options.js"></script>
  </body>
</html>
